@if (!isDirectMode()) {
  @if (layout === 'desktop') {
    <div class="nav-group flex items-center gap-1 pt-4">
      <button class="hover:scale-110 active:scale-90 transition-all text-white p-1" (click)="handlePrevious()" title="Précédent">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      <button class="hover:scale-110 active:scale-90 transition-all text-white p-1" (click)="handleNext()" title="Suivant">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6z"/></svg>
      </button>
    </div>

    <!-- Vertical Separator -->
    <div class="nav-separator mx-4 hidden sm:block h-8 w-px bg-white/20"></div>
  } @else {
    <!-- MOBILE LAYOUT (Capsule) -->
    <div class="capsule flex items-center gap-1 px-1 py-1 bg-white/5 rounded-full border border-white/10 backdrop-blur-md">
      <button (click)="handlePrevious()" class="text-white/90 active:scale-90 p-2" title="Précédent">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      
      <button (click)="onToggleInfo($event)" 
              class="w-8 h-8 flex items-center justify-center text-white/90 active:scale-90 rounded-full transition-colors" 
              [class.bg-white/20]="showInfo"
              title="Informations">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
      </button>

      <button (click)="handleNext()" class="text-white/90 active:scale-90 p-2" title="Suivant">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6z"/></svg>
      </button>
    </div>
  }
}
