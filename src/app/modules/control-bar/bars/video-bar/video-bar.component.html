<div class="control-bar relative flex flex-col w-full text-white overflow-visible transition-all duration-300 h-20">
  
  <!-- Info Popin (XS only) -->
  @if (showInfoPopin()) {
    <div class="info-popin absolute bottom-[calc(100%+8px)] left-4 right-4 bg-black/95 backdrop-blur-md border border-white/20 p-4 rounded-xl z-50 shadow-2xl">
      <div class="flex flex-col gap-1">
        <span class="chapitre uppercase text-[10px] tracking-widest text-white/50 font-semibold mb-1">
          {{ chapterTitle() }}
        </span>
        <span class="sequence text-base font-bold text-white leading-tight">
          {{ sequenceTitle() }}
        </span>
        <span class="sous-chapitre text-[12px] text-white/70 italic mt-0.5">
          {{ subChapterTitle() }}
        </span>
      </div>
    </div>
  }
  
  <!-- Progress Bar Container -->
  <div class="progress-bar-container group relative w-full h-1 bg-white/20 cursor-pointer overflow-visible">
    <input type="range"
           class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-20"
           [min]="0"
           [max]="duration()"
           [ngModel]="currentTime()"
           (input)="handleSeek($event)">
    <!-- Progress Fill -->
    <div class="progress-fill absolute top-0 left-0 h-full bg-white/90 transition-all duration-100 ease-linear"
         [style.width.%]="(currentTime() / duration()) * 100">
    </div>
    <!-- Progress Handle (Hover only) -->
    <div class="progress-handle absolute top-1/2 -translate-y-1/2 w-3 h-3 bg-white rounded-full shadow-lg opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none"
         [style.left.%]="(currentTime() / duration()) * 100">
    </div>
  </div>

  <!-- Content Container (Always Row, Fixed Height) -->
  <div class="flex flex-row items-center justify-between px-4 h-full gap-4">
    
    <!-- SECTION LEFT: Playback Controls -->
    <div class="controls-left flex items-center gap-2 sm:gap-4 flex-shrink-0">
      <!-- Skip Back -->
      <button class="time-skip-button flex items-center justify-center p-2 hover:text-white transition-colors" (click)="handleStepBackward()">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/></svg>
        <span class="ml-1 text-[10px] hidden md:inline">-10s</span>
      </button>

      <!-- Play / Pause -->
      <button class="play-button bg-white/10 hover:bg-white/20 active:scale-95 flex items-center justify-center rounded-full transition-all backdrop-blur-md" 
              (click)="handleTogglePlay()">
        @if (isPlaying()) {
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M5 3l14 9-14 9V3z"/></svg>
        }
      </button>

      <!-- Skip Forward -->
      <button class="time-skip-button flex items-center justify-center p-2 hover:text-white transition-colors" (click)="handleStepForward()">
        <span class="mr-1 text-[10px] hidden md:inline">+10s</span>
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 17l5-5-5-5M6 17l5-5-5-5"/></svg>
      </button>

      <!-- Time Display (Hidden on XS) -->
      <div class="time-display hidden sm:flex items-center gap-1 text-[11px] md:text-sm font-medium text-white/80 tabular-nums">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hidden md:inline"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span>{{ formatTime(currentTime()) }}</span>
        <span class="text-white/40">/</span>
        <span class="text-white/60">{{ formatTime(duration()) }}</span>
      </div>
    </div>

    <!-- SECTION CENTER: Navigation & Metadata -->
    <div class="controls-center flex items-center gap-2 sm:gap-4 flex-1 min-w-0 justify-center">
      <!-- Prev Sequence -->
      <button class="icon-button" (click)="handlePrevious()" *ngIf="showNavigation()">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
      </button>

      <!-- Metadata (Desktop: Inline | Mobile: Info Button & Popin) -->
      <div class="lesson-info hidden sm:flex flex-col justify-center min-w-0 text-left">
        <span class="chapitre uppercase text-[10px] tracking-widest text-white/50 font-semibold mb-0.5 truncate">
          {{ chapterTitle() }}
        </span>
        <span class="sous-chapitre uppercase text-[10px] tracking-widest text-white/50 font-semibold mb-0.5 truncate">
          {{ subChapterTitle() }}
        </span>
        <span class="sequence text-sm font-bold text-white truncate">
          {{ sequenceTitle() }}
        </span>
      </div>

      <!-- Info Button (Visible ONLY on XS) -->
      <button class="xs-info-button flex sm:hidden items-center justify-center p-2 rounded-full bg-white/10 hover:bg-white/20 transition-all active:scale-95"
              (click)="toggleInfoPopin()">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
      </button>

      <!-- Next Sequence -->
      <button class="icon-button flex" (click)="handleNext()" *ngIf="showNavigation()">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
      </button>
    </div>

    <!-- SECTION RIGHT: Switches & Settings (Selective Hide on XS) -->
    <div class="controls-right flex items-center gap-2 sm:gap-4 flex-shrink-0 justify-end">
      <!-- Tab Switcher (Desktop only) -->
      <div class="hidden sm:flex">
        <div class="tab-switcher flex items-center gap-1 bg-white/10 p-1 rounded-lg">
          <button [class.active]="activeTab() === 'video'" 
                  (click)="setTab('video')"
                  class="p-1.5 rounded-md transition-all hover:bg-white/10"
                  [style.background]="activeTab() === 'video' ? 'rgba(255,255,255,0.15)' : 'transparent'">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
          </button>
          <button [class.active]="activeTab() === 'metronome'" 
                  (click)="setTab('metronome')"
                  class="p-1.5 rounded-md transition-all hover:bg-white/10"
                  [style.background]="activeTab() === 'metronome' ? 'rgba(255,255,255,0.15)' : 'transparent'">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h20"/><path d="m14.5 10.5 8-8"/><path d="m6.62 19.38 2.13-2.13"/><circle cx="12" cy="14" r="2"/></svg>
          </button>
        </div>
      </div>

      <!-- Settings (Hidden on XS) -->
      <div class="flex">
        <button class="icon-button">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.64 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
        </button>
      </div>

      <!-- Fullscreen (Hidden on XS) -->
      <div class="hidden sm:flex">
        <button class="icon-button" (click)="toggleFullscreen()">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>
