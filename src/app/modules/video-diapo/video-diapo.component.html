<div class="relative w-full h-full bg-zinc-950 overflow-hidden">
  <div class="flex flex-col md:grid md:grid-cols-3 h-full overflow-y-auto md:overflow-hidden custom-scrollbar">
    
    <!-- Video Section: Top on mobile, right on desktop -->
    <div 
      [class]="classVideoContainer() + ' order-1 md:order-2 flex items-center justify-center bg-black min-h-[30vh] md:min-h-0'"
    >
      <app-video 
        mode="fixed-ratio"
        class="w-full"
        [typeImg]="typeImg()" 
        [mediaId]="currentVideo()!"
      ></app-video>
    </div>

    <!-- Diapo Section: Bottom on mobile, left on desktop -->
    <div 
      [class]="classImgContainer() + ' order-2 md:order-1 h-full min-h-[50vh] md:min-h-0'"
    >
      <app-diapo theme="dark" [showControls]="true" [allowZoom]="!isMobile()"></app-diapo>
    </div>

  </div>

  <div class="fixed bottom-0 w-full z-10 transition-all duration-300">
    <app-control-bar />
  </div>

  <div class="fixed top-8 right-8 flex flex-col gap-3 group">
    <div
      class="flex flex-col gap-2 p-2 bg-black/40 backdrop-blur-md rounded-2xl border border-white/10 opacity-0 group-hover:opacity-100 transition-all duration-300 translate-x-4 group-hover:translate-x-0"
    >
      <p-button
        (onClick)="changeLayout('1/2')"
        [severity]="
          videoDiapoLayout().imageRatio === '1/2' ? 'primary' : 'secondary'
        "
        icon="pi pi-columns"
        [rounded]="true"
        [text]="true"
        pTooltip="Split 50/50"
      />
      <p-button
        (onClick)="changeLayout('1/3')"
        [severity]="
          videoDiapoLayout().imageRatio === '1/3' ? 'primary' : 'secondary'
        "
        icon="pi pi-table"
        [rounded]="true"
        [text]="true"
        pTooltip="Small Score"
      />
      <p-button
        (onClick)="changeLayout('full')"
        [severity]="
          videoDiapoLayout().imageRatio === 'full' ? 'primary' : 'secondary'
        "
        icon="pi pi-image"
        [rounded]="true"
        [text]="true"
        pTooltip="Full Score"
      />
    </div>

    <p-button
      icon="pi pi-cog"
      [rounded]="true"
      severity="secondary"
      class="shadow-2xl"
      pTooltip="Layout Matrix"
    />
  </div>
</div>
