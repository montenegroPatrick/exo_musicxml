<!-- MAIN CONTAINER -->
<div class="audiomixer-control-bar relative flex flex-row items-center justify-between px-6 w-full text-white h-full shadow-[0_-4px_12px_rgba(0,0,0,0.2)]">
    
    <!-- Popins Overlay -->
    @if (settingsVisible()) {
      <div class="fixed inset-0 z-[10] bg-black/[0.01]" (click)="closePopins()"></div>
    }

    <!-- SEEK BAR (Hidden in pure MIDI mode because duration is unknown) -->
    @if (!isMidiMode()) {
    <div class="progress-bar-container group absolute top-0 left-0 w-full h-[3px] bg-white/20 cursor-pointer overflow-visible z-[100]">
      <input type="range"
             class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-20"
             [min]="0"
             [max]="duration() || 100"
             step="0.1"
             [(ngModel)]="seekbarValue"
             (mousedown)="startDragging()"
             (mouseup)="onSeekEnd()"
             (touchstart)="startDragging()"
             (touchend)="onSeekEnd()">
      
      <!-- Progress Fill -->
      <div class="progress-fill absolute top-0 left-0 h-full bg-white transition-all duration-100 ease-linear shadow-[0_0_8px_rgba(255,255,255,0.5)]"
           [style.width.%]="(currentTime() / (duration() || 1)) * 100">
      </div>
      
      <!-- Progress Handle -->
      <div class="progress-handle absolute top-1/2 -translate-x-1/2 -translate-y-1/2 w-3.5 h-3.5 bg-white rounded-full shadow-lg opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none"
           [style.left.%]="(currentTime() / (duration() || 1)) * 100">
      </div>
    </div>
    }

    <div class="grid grid-cols-3 items-center w-full h-full px-6 gap-6">
      
      <!-- LEFT ZONE: Navigation & Metadata -->
      <div class="flex items-center flex-1 min-w-0">
        @if (!isDirectMode()) {
          <div class="nav-group flex items-center gap-6 pr-6 border-r border-white/30 h-10">
            <button class="hover:scale-110 active:scale-90 transition-transform text-white bg-transparent border-none p-0 flex items-center cursor-pointer" (click)="handlePrevious()">
              <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
            </button>
            <button class="hover:scale-110 active:scale-90 transition-transform text-white bg-transparent border-none p-0 flex items-center cursor-pointer" (click)="handleNext()">
              <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6z"/></svg>
            </button>
          </div>
        }

        <div class="flex items-center min-w-0 flex-1 pl-6">
          <app-lesson-metadata layout="inline" />
        </div>
      </div>

      <!-- CENTER ZONE: Playback Controls & Tempo -->
      <div class="controls-center flex items-center gap-8 flex-shrink-0 justify-center">
        
        <!-- Mixer Toggle Button -->
        <button class="mixer-btn w-10 h-10 flex items-center justify-center rounded-lg hover:bg-white/20 transition-all bg-transparent border-none p-0 text-white cursor-pointer"
                [class.bg-white/20]="mixerVisible()"
                (click)="toggleMixer()"
                title="Table de mixage MIDI">
           <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
             <line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/>
           </svg>
        </button>

        <!-- Play / Pause -->
        <button class="play-button flex items-center justify-center w-14 h-14 bg-white/10 hover:bg-white/20 active:scale-95 rounded-full transition-all border-none p-0 cursor-pointer backdrop-blur-md" 
                (click)="togglePlay()">
          @if (isPlaying()) {
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
          } @else {
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><path d="M5 3l14 9-14 9V3z"/></svg>
          }
        </button>

        <!-- Tempo Control -->
          <app-midi-tempo></app-midi-tempo>
      </div>

      <!-- RIGHT ZONE: Options (Print & Settings) -->
      <div class="flex items-center gap-1.5 sm:gap-4 flex-1 justify-end relative">
        
        <!-- MODE SWITCHER (Icons) -->
        @if (hasVideo() || hasAudio()) {
          <div class="flex items-center bg-white/5 p-0.5 sm:p-1 rounded-lg sm:rounded-xl border border-white/10 shrink-0">
            <button (click)="switchToMedia()" class="w-7 h-7 sm:w-8 sm:h-8 flex items-center justify-center rounded-md sm:rounded-lg text-white/40 hover:text-white/60 transition-all">
              @if (hasVideo()) {
                <i class="pi pi-video text-[10px] sm:text-xs"></i>
              } @else {
                <i class="pi pi-volume-up text-[10px] sm:text-xs"></i>
              }
            </button>
            <button class="w-7 h-7 sm:w-8 sm:h-8 flex items-center justify-center rounded-md sm:rounded-lg bg-white/20 text-white shadow-lg">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
            </button>
          </div>
          <div class="w-px h-6 bg-white/40 mx-0.5 hidden sm:block"></div>
        }

        <!-- Print Button -->
        <button (click)="handlePrint()" 
                class="w-10 h-10 flex items-center justify-center rounded-lg hover:bg-white/10 transition-all text-white/70 hover:text-white cursor-pointer"
                title="Imprimer la partition">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/>
          </svg>
        </button>

        <!-- Settings Button -->
        <button (click)="toggleSettings()" 
                class="w-10 h-10 flex items-center justify-center rounded-lg hover:bg-white/10 transition-all text-white/80 hover:text-white cursor-pointer"
                [class.bg-white/20]="settingsVisible()"
                title="Réglages">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>

        <!-- Settings Popin (Standardized Format) -->
        @if (settingsVisible()) {
          <div class="settings-popin absolute bottom-[calc(100%+16px)] right-0 w-72 bg-black/95 backdrop-blur-xl border border-white/20 p-5 rounded-2xl z-[80] shadow-2xl animate-in fade-in slide-in-from-bottom-2 duration-200">
            
            <div class="flex flex-col gap-6">
              
              <!-- Zoom Section -->
              <div class="flex flex-col gap-3">
                <div class="flex items-center justify-between">
                  <span class="text-[9px] font-black uppercase tracking-[0.2em] text-white/30">Zoom Score</span>
                  <span class="text-xs font-mono font-bold text-[#FA5E46]">{{ zoomValue() }}%</span>
                </div>
                <div class="relative h-4 flex items-center">
                  <!-- Center Mark (100%) -->
                  <div class="absolute left-[33.33%] top-0 -translate-x-1/2 w-px h-full bg-white/40 z-10"></div>
                  <input type="range" 
                         [min]="50" 
                         [max]="200" 
                         [ngModel]="zoomValue()" 
                         (input)="onZoomSliderChange($any($event.target).value)"
                         class="w-full h-1 bg-white rounded-full cursor-pointer accent-[#FA5E46]">
                </div>
              </div>

              <!-- Metronome Section -->
              <div class="flex flex-col gap-3 pt-2 border-t border-white/10">
                <span class="text-[9px] font-black uppercase tracking-[0.2em] text-white/30">Métronome</span>
                <div class="grid grid-cols-3 gap-2 p-1 bg-black/40 rounded-xl border border-white/5">
                  <button (click)="setMetronomeMode(0)" 
                          class="flex flex-col items-center gap-1.5 py-3 rounded-lg transition-all border-none cursor-pointer group"
                          [class.bg-white/10]="metronomeMode() === 0"
                          [class.text-white]="metronomeMode() === 0"
                          [class.text-white/30]="metronomeMode() !== 0">
                    <i class="pi pi-volume-off text-sm group-hover:text-white/60"></i>
                    <span class="text-[7px] font-bold uppercase tracking-tighter">OFF</span>
                  </button>
                  <button (click)="setMetronomeMode(1)" 
                          class="flex flex-col items-center gap-1.5 py-3 rounded-lg transition-all border-none cursor-pointer group"
                          [class.bg-white/10]="metronomeMode() === 1"
                          [class.text-white]="metronomeMode() === 1"
                          [class.text-white/30]="metronomeMode() !== 1">
                    <i class="pi pi-clock text-sm group-hover:text-white/60"></i>
                    <span class="text-[7px] font-bold uppercase tracking-tighter">COUNT</span>
                  </button>
                  <button (click)="setMetronomeMode(2)" 
                          class="flex flex-col items-center gap-1.5 py-3 rounded-lg transition-all border-none cursor-pointer"
                          [class.bg-[#FA5E46]]="metronomeMode() === 2"
                          [class.text-white]="metronomeMode() === 2"
                          [class.text-white/30]="metronomeMode() !== 2">
                    <i class="pi pi-volume-up text-sm"></i>
                    <span class="text-[7px] font-bold uppercase tracking-tighter">ALWAYS</span>
                  </button>
                </div>
              </div>

            </div>

            <!-- Arrow tail -->
            <div class="absolute top-full right-6 w-3 h-3 bg-black/95 border-r border-b border-white/20 rotate-45 -mt-1.5"></div>
          </div>
        }

      </div>
    </div>
</div>
