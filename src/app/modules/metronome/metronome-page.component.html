<div class="h-full w-full bg-[#000000] flex flex-col items-center justify-center p-2 sm:p-4 select-none overflow-hidden">
  
  <!-- BPM Main Display -->
  <div class="text-center mb-2 w-full max-w-2xl">
    <div class="flex items-center justify-center gap-2 mb-0">
      <h1 class="text-[140px] font-bold text-[#FA5E46] leading-none tracking-tighter">
        {{ metronomeService.bpm() }}
      </h1>
      <span class="text-xl font-bold text-[#FA5E46] mt-10">BPM</span>
    </div>
    <p class="text-lg font-medium text-white/80 italic mb-2 tracking-wide">{{ currentTempoLabel() }}</p>
  </div>

  <!-- Minimalist Slider Controls -->
  <div class="w-full max-w-4xl flex items-center gap-6 mb-4">
    <button (click)="decreaseBpm(1)" class="w-12 h-12 rounded-full border border-white/40 text-white flex items-center justify-center hover:bg-white/10 active:scale-95 transition-all">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"/></svg>
    </button>
    <div class="flex-1 relative h-10 flex items-center">
      <input type="range" 
             min="20" max="300"
             [ngModel]="metronomeService.bpm()"
             (input)="onBpmChange($event)"
             class="legacy-slider w-full appearance-none bg-white/20 h-0.5 rounded-full outline-none">
    </div>
    <button (click)="increaseBpm(1)" class="w-12 h-12 rounded-full border border-white/40 text-white flex items-center justify-center hover:bg-white/10 active:scale-95 transition-all">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
    </button>
  </div>

  <!-- Rhythm Circles -->
  <div class="flex justify-center gap-4 mb-4">
    <div *ngFor="let i of beats(); let idx = index"
         class="w-5 h-5 rounded-full border-2 transition-all duration-75"
         [class.bg-white]="metronomeService.currentBeat() === idx"
         [class.border-white]="metronomeService.currentBeat() !== idx"
         [class.border-white/100]="metronomeService.currentBeat() === idx">
    </div>
  </div>

  <!-- Central Action Buttons -->
  <div class="flex items-center justify-center gap-8 mb-6">
    <button (click)="tapTempo()" 
            class="w-28 h-20 bg-white rounded-xl text-[#FA5E46] font-bold text-3xl shadow-lg hover:bg-white/90 active:scale-95 transition-all">
      {{ 'label.metronome.tap' | translate : locale.language }}
    </button>

    <button (click)="metronomeService.togglePlay()" 
            class="w-20 h-20 rounded-full bg-white text-[#FA5E46] shadow-xl hover:scale-105 active:scale-95 transition-all flex items-center justify-center ring-4 ring-white/10">
      <svg *ngIf="!metronomeService.isPlaying()" xmlns="http://www.w3.org/2000/svg" class="w-10 h-10 translate-x-1" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <svg *ngIf="metronomeService.isPlaying()" xmlns="http://www.w3.org/2000/svg" class="w-10 h-10" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
    </button>
  </div>

  <!-- Settings Lines -->
  <div class="w-full max-w-4xl space-y-4">
    
    <!-- Accent Option -->
    <div class="flex items-center justify-between group">
      <div class="flex items-center gap-4 cursor-pointer" (click)="metronomeService.accentFirstBeat.set(!metronomeService.accentFirstBeat())">
        <div class="w-5 h-5 border-2 border-white rounded flex items-center justify-center" [class.bg-white]="metronomeService.accentFirstBeat()">
          <svg *ngIf="metronomeService.accentFirstBeat()" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-black" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" /></svg>
        </div>
        <span class="text-white font-bold text-xs tracking-widest uppercase">{{ 'label.metronome.accent' | translate : locale.language }}</span>
      </div>
      
      <div class="flex items-center gap-6">
        <div class="flex items-center gap-3">
          <button (click)="updateSignature(-1)" class="w-8 h-8 rounded-full bg-white text-black flex items-center justify-center hover:bg-white/90 active:scale-90 transition-all">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path d="M20 12H4"/></svg>
          </button>
          <span class="text-xl font-black text-white w-6 text-center">{{ metronomeService.timeInMeasure() }}</span>
          <button (click)="updateSignature(1)" class="w-8 h-8 rounded-full bg-white text-black flex items-center justify-center hover:bg-white/90 active:scale-90 transition-all">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path d="M12 4v16m8-8H4"/></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Subdivision Icons Grid -->
    <div class="flex justify-between gap-4 py-2 border-t border-white/20">
      <button *ngFor="let s of [1, 2, 4, 3, 'shuffle']" 
              (click)="setSub(s)"
              class="flex-1 aspect-square max-w-[65px] h-[65px] rounded-lg transition-all flex items-center justify-center"
              [class.bg-[#FA5E46]]="metronomeService.subdivision() === (s === 'shuffle' ? 3 : s) && (s === 'shuffle' ? metronomeService.isShuffle() : !metronomeService.isShuffle())"
              [class.bg-white/20]="metronomeService.subdivision() !== (s === 'shuffle' ? 3 : s) || (s === 'shuffle' ? !metronomeService.isShuffle() : metronomeService.isShuffle())">
        
        <!-- Legacy Class-based Icons -->
        <i class="ico" [ngClass]="{
          'ico-noires': s === 1,
          'ico-croches': s === 2,
          'ico-doubles': s === 4,
          'ico-triolets': s === 3,
          'ico-shuffle': s === 'shuffle'
        }"></i>
      </button>
    </div>

    <div class="w-full h-px bg-white/10"></div>

    <!-- Chronometer Line -->
    <div class="flex items-center justify-between group">
      <div class="flex items-center gap-4 cursor-pointer" (click)="toggleTimer()">
        <div class="w-5 h-5 border-2 border-white rounded flex items-center justify-center" [class.bg-white]="isTimerActive()">
          <svg *ngIf="isTimerActive()" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-black" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" /></svg>
        </div>
        <span class="text-white font-bold text-xs tracking-widest uppercase">{{ 'label.metronome.timer' | translate : locale.language }}</span>
      </div>
      
      <div class="flex items-center gap-6">
        <div class="flex items-center gap-3">
          <button (click)="addTime(-60)" class="w-8 h-8 rounded-full bg-white text-black flex items-center justify-center hover:bg-white/90 active:scale-90 transition-all">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path d="M20 12H4"/></svg>
          </button>
          <span class="text-lg font-bold font-mono text-white w-20 text-center">
            {{ timerMinutes() | number:'2.0' }}:{{ timerSeconds() | number:'2.0' }}
          </span>
          <button (click)="addTime(60)" class="w-8 h-8 rounded-full bg-white text-black flex items-center justify-center hover:bg-white/90 active:scale-90 transition-all">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path d="M12 4v16m8-8H4"/></svg>
          </button>
        </div>
      </div>
    </div>

  </div>

</div>
