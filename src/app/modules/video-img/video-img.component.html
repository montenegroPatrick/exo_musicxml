<div class="w-full h-full grid grid-cols-4">
  <div class="flex {{ classImgContainer() }}">
    <div class="bg-amber-400 w-10 flex flex-col justify-start items-start">
      <p-button size="small" (click)="changeLayout('1/4')">1/4</p-button>
      <p-button size="small" (click)="changeLayout('1/3')">1/3</p-button>
      <p-button size="small" (click)="changeLayout('1/2')">1/2</p-button>
      <p-button size="small" (click)="changeLayout('full')">full</p-button>
    </div>
    <div class="flex-1">
      <app-img></app-img>
    </div>
  </div>

  <div
    class="flex {{ classVideoContainer() }} flex-col justify-center bg-black"
  >
    <app-video
      [typeImg]="typeImg()"
      [mediaId]="currentVideo()"
      [autostart]="true"
    ></app-video>
  </div>
</div>
