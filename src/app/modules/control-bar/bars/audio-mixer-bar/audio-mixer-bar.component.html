<div class="flex flex-row gap-4 justify-between px-4 items-center h-full relative">
  <!-- Info Popin (XS only) -->
  @if (showInfoPopin()) {
    <div class="info-popin absolute bottom-[calc(100%+8px)] left-4 right-4 bg-black/95 backdrop-blur-md border border-white/20 p-4 rounded-xl z-50 shadow-2xl">
      <app-lesson-metadata layout="popin" />
    </div>
  }

  <div class="flex items-center">
    <app-lesson-navigator 
      [layout]="isMobile() ? 'mobile' : 'desktop'"
      [showInfo]="showInfoPopin()"
      (previous)="handlePrevious()" 
      (next)="handleNext()"
      (toggleInfo)="toggleInfoPopin()">
    </app-lesson-navigator>

    <app-play-controls
      (togglePlay)="handleTogglePlay()"
      (stepBackward)="handleStepBackward()"
      (stepForward)="handleStepForward()"
    />
  </div>

  <app-lesson-metadata layout="inline" />

  <!-- Loop Popin -->
  @if (activePopin() === 'loop') {
    <div class="settings-popin absolute bottom-[calc(100%+8px)] right-4 w-48 bg-black/95 backdrop-blur-md border border-white/20 p-2 rounded-xl z-[80] shadow-2xl animate-in fade-in slide-in-from-bottom-2 duration-200" (click)="$event.stopPropagation()">
      <div class="flex flex-col gap-2 p-1">
        <h3 class="text-[9px] font-bold text-white/40 uppercase tracking-wider mb-1">Boucle A-B</h3>
        
        <div class="flex flex-col gap-1.5">
          <button (click)="setLoopA()" class="flex items-center justify-between p-2 rounded-lg hover:bg-white/10 transition-colors border border-white/5">
            <span class="text-xs">Point A</span>
            <span class="text-[10px] text-white/40">{{ loopStart() ? formatTime(loopStart()!) : '--:--' }}</span>
          </button>
          
          <button (click)="setLoopB()" [disabled]="loopStart() === null" class="flex items-center justify-between p-2 rounded-lg hover:bg-white/10 transition-colors border border-white/5 disabled:opacity-30">
            <span class="text-xs">Point B</span>
            <span class="text-[10px] text-white/40">{{ loopEnd() ? formatTime(loopEnd()!) : '--:--' }}</span>
          </button>

          @if (isLooping()) {
            <button (click)="clearLoop()" class="mt-2 p-2 rounded-lg bg-red-500/20 hover:bg-red-500/30 text-red-400 text-[10px] font-bold uppercase transition-colors">
              Effacer la boucle
            </button>
          }
        </div>
      </div>
    </div>
  }

  <!-- Timeline: Progress slider with time display -->
  <div class="flex-grow h-full pt-4">
    <div class="progress-bar-container group relative w-full h-2 sm:h-1 bg-white/20 cursor-pointer overflow-visible rounded-full"
         (mousemove)="handleProgressBarMove($event)"
         (touchmove)="handleProgressBarMove($event)"
         (mouseup)="stopDrag()"
         (touchend)="stopDrag()"
         (mouseleave)="stopDrag()">
      
      <input type="range"
             class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-20"
             [min]="0"
             [max]="duration()"
             [ngModel]="currentTime()"
             (input)="handleSeek($event)"
             [disabled]="draggingMarker() !== null">

      <!-- Active Loop Range Highlight -->
      @if (loopStart() !== null && loopEnd() !== null) {
        <div class="progress-active-range"
             [style.left.%]="(loopStart()! / (duration() || 1)) * 100"
             [style.width.%]="((loopEnd()! - loopStart()!) / (duration() || 1)) * 100">
        </div>
      }

      <!-- Progress Fill -->
      <div class="progress-fill absolute top-0 left-0 h-full bg-[#aec739] shadow-[0_0_8px_rgba(174,199,57,0.4)] transition-all duration-100 ease-linear rounded-full"
           [style.width.%]="(currentTime() / (duration() || 1)) * 100">
      </div>

      <!-- Loop Marker A -->
      @if (loopStart() !== null) {
        <div class="loop-marker loop-marker-a -translate-y-1/2"
             [style.left.%]="(loopStart()! / (duration() || 1)) * 100"
             (mousedown)="startDrag('A', $event)"
             (touchstart)="startDrag('A', $event)">
        </div>
      }

      <!-- Loop Marker B -->
      @if (loopEnd() !== null) {
        <div class="loop-marker loop-marker-b -translate-x-full -translate-y-1/2"
             [style.left.%]="(loopEnd()! / (duration() || 1)) * 100"
             (mousedown)="startDrag('B', $event)"
             (touchstart)="startDrag('B', $event)">
        </div>
      }

      <!-- Progress Handle (Hover only) -->
      <div class="progress-handle absolute top-1/2 -translate-x-1/2 -translate-y-1/2 w-3.5 h-3.5 bg-white rounded-full shadow-lg opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none"
           [style.left.%]="(currentTime() / (duration() || 1)) * 100">
      </div>
    </div>
  </div>

  <!-- Right side controls -->
  <section class="flex items-center gap-2 rounded-lg">
    <!-- MODE SWITCHER (Icons) -->
    @if (hasVideo() && !isScoreMode()) {
      <div class="flex items-center bg-white/5 p-0.5 sm:p-1 rounded-lg sm:rounded-xl border border-white/10 shrink-0">
        <button (click)="navigateToMode('video')" class="w-7 h-7 sm:w-8 sm:h-8 flex items-center justify-center rounded-md sm:rounded-lg text-white/40 hover:text-white/60 transition-all">
          <i class="pi pi-video text-[10px] sm:text-xs"></i>
        </button>
        <button class="w-7 h-7 sm:w-8 sm:h-8 flex items-center justify-center rounded-md sm:rounded-lg bg-white/20 text-white shadow-lg">
          <i class="pi pi-volume-up text-[10px] sm:text-xs"></i>
        </button>
      </div>
      <div class="w-px h-6 bg-white/10 mx-1 hidden sm:block"></div>
    }

    <!-- Volume Control -->
    <app-volume-control (volumeChange)="handleVolumeChange($event)" />

    <!-- Playback Speed -->
    <app-speed-control (speedChange)="handleSpeedChange($event)" />

    <!-- Loop Button -->
    <button (click)="toggleLoopActive(); $event.stopPropagation()" 
            (contextmenu)="toggleLoopPopin(); $event.preventDefault(); $event.stopPropagation()"
            class="w-8 h-8 sm:w-9 sm:h-9 flex items-center justify-center rounded-lg hover:bg-white/10 transition-all relative text-white/70 hover:text-white"
            [class.bg-white/20]="isLooping()"
            [class.text-[#aec739]]="isLooping()"
            [class.shadow-inner]="isLooping()"
            title="Boucle A-B">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>
      @if (activePopin() === 'loop') {
        <div class="absolute -top-1 -right-1 w-1.5 h-1.5 bg-white rounded-full"></div>
      }
    </button>

    <app-unified-mixer mode="audio"></app-unified-mixer>
  </section>
</div>
